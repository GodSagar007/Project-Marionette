[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "marionette"
version = "0.1.0"
description = "Instrumented observation environment for AI agents."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "Sagar Tewari", email = "tewarisagar007@gmail.com" },
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/marionette"]

[tool.hatch.build.targets.wheel.force-include]
"src/marionette/py.typed" = "marionette/py.typed"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes (undefined names, unused imports)
    "I",    # isort (import ordering)
    "UP",   # pyupgrade (modernize syntax)
    "B",    # flake8-bugbear (likely bugs)
    "SIM",  # flake8-simplify (cleaner alternatives)
    "RUF",  # ruff-specific rules
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src/marionette", "tests"]
explicit_package_bases = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
pretty = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]
